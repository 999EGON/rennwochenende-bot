name: Session-Erinnerungen

on:
  schedule:
    # Jeden Tag alle 15 Minuten (Zeiten in UTC), damit auch Sessions unter der Woche
    # (z. B. Le Mans, Sebring, Petit Le Mans am Mittwoch) erinnert werden. Steht nichts an,
    # beendet sich der Bot nach wenigen Sekunden. Öffentliches Repo: Actions-Minuten kostenlos.
    # Bewusst nicht zur vollen Stunde (:00), dort verspätet GitHub geplante Läufe am häufigsten.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # damit der Bot sich merken kann, was schon gepostet wurde

concurrency:
  group: session-erinnerungen
  cancel-in-progress: false

jobs:
  erinnern:
    runs-on: ubuntu-latest
    timeout-minutes: 80   # Job darf bis zu 50 min auf die nächste Session warten
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Erinnerungen für bald startende Sessions posten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: eigener Kanal nur für die Erinnerungen (leer = gleicher Kanal wie Übersicht)
          ERINNERUNGEN_WEBHOOK_URL: ${{ secrets.ERINNERUNGEN_WEBHOOK_URL }}
          # Diese Rolle wird bei jeder Erinnerung gepingt (Repository-Variable, leer = kein Ping)
          DISCORD_ROLLEN_ID: ${{ vars.DISCORD_ROLLEN_ID }}
          VORLAUF_MINUTEN: "30"   # wie viele Minuten vor dem Start erinnert wird
          WARTEN_MINUTEN: "50"    # so weit vorausschauen und im Job warten (GitHub startet oft nur stündlich)
          NACHHOL_MINUTEN: "60"   # verpasste Sessions bis so lange nach dem Start nachträglich posten
          WEC_AUTOMATISCH: "ja"   # WEC-Zeitplan automatisch von fiawec.com laden
        run: python bot.py --erinnerungen
      - name: Merken, was gepostet wurde
        if: always()
        run: |
          if [ -f gepostet.json ] && [ -n "$(git status --porcelain gepostet.json)" ]; then
            git config user.name "rennwochenende-bot"
            git config user.email "rennwochenende-bot@users.noreply.github.com"
            git add gepostet.json
            git commit -m "Gepostete Sessions aktualisiert"
            git pull --rebase --quiet || true
            git push
          fi
