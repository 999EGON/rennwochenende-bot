name: Session-Erinnerungen

on:
  schedule:
    # Jeden Tag alle 15 Minuten (Zeiten in UTC), damit auch Sessions unter der Woche
    # (z. B. Le Mans, Sebring, Petit Le Mans am Mittwoch) erinnert werden. Steht nichts an,
    # beendet sich der Bot nach wenigen Sekunden. Öffentliches Repo: Actions-Minuten kostenlos.
    # Bewusst nicht zur vollen Stunde (:00), dort verspätet GitHub geplante Läufe am häufigsten.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # damit der Bot sich merken kann, was schon gepostet wurde

concurrency:
  group: session-erinnerungen
  cancel-in-progress: false

jobs:
  erinnern:
    runs-on: ubuntu-latest
    timeout-minutes: 80   # Job darf bis zu 50 min auf die nächste Session warten
    steps:
      - uses: actions/checkout@v5
        with:
          # Immer den neuesten Stand von main holen. Ohne das bekommt ein Lauf, der in der
          # Warteschlange stand, den Stand vom Anlegen – ohne die Einträge des Laufs davor,
          # und postet dieselbe Session ein zweites Mal (so passiert am 07.11.2026).
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Erinnerungen für bald startende Sessions posten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: eigener Kanal nur für die Erinnerungen (leer = gleicher Kanal wie Übersicht)
          ERINNERUNGEN_WEBHOOK_URL: ${{ secrets.ERINNERUNGEN_WEBHOOK_URL }}
          # Diese Rolle wird bei jeder Erinnerung gepingt (Repository-Variable, leer = kein Ping)
          DISCORD_ROLLEN_ID: ${{ vars.DISCORD_ROLLEN_ID }}
          VORLAUF_MINUTEN: "30"   # wie viele Minuten vor dem Start erinnert wird
          WARTEN_MINUTEN: "50"    # so weit vorausschauen und im Job warten (GitHub startet oft nur stündlich)
          NACHHOL_MINUTEN: "60"   # verpasste Sessions bis so lange nach dem Start nachträglich posten
          WEC_AUTOMATISCH: "ja"   # WEC-Zeitplan automatisch von fiawec.com laden
          LOESCHEN: "ja"          # Erinnerungen nach der Session und die Wochenübersicht nach dem Wochenende löschen
          LOESCHEN_NACH_MINUTEN: "60"   # so lange nach dem Ende der Session wird gelöscht
        run: python bot.py --erinnerungen
      - name: Merken, was gepostet wurde
        if: always()
        run: |
          git config user.name "rennwochenende-bot"
          git config user.email "rennwochenende-bot@users.noreply.github.com"
          # Eigene Stände sichern, auf den neuesten Stand von main setzen und beide vereinen.
          # So gehen keine Einträge verloren, auch wenn main sich inzwischen geändert hat.
          mkdir -p "$RUNNER_TEMP/eigen"
          for datei in gepostet.json loeschen.json; do
            if [ -f "$datei" ]; then cp "$datei" "$RUNNER_TEMP/eigen/"; fi
          done
          for versuch in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python bot.py --status-vereinen "$RUNNER_TEMP/eigen"
            if [ -z "$(git status --porcelain gepostet.json loeschen.json)" ]; then
              echo "Nichts Neues zu speichern."
              exit 0
            fi
            for datei in gepostet.json loeschen.json; do
              if [ -f "$datei" ]; then git add "$datei"; fi
            done
            git commit --quiet -m "Gepostete Sessions aktualisiert"
            if git push --quiet origin HEAD:main; then
              echo "Gespeichert (Versuch $versuch)."
              exit 0
            fi
            echo "Push abgelehnt, neuer Versuch …"
            sleep 5
          done
          echo "::error::gepostet.json/loeschen.json konnten nicht gespeichert werden"
          exit 1
