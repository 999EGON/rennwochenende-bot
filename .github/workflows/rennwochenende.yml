name: Rennwochenende posten

on:
  schedule:
    # Jeden Donnerstag um 17:07 UTC (= 18:07 Uhr Winterzeit / 19:07 Uhr Sommerzeit in Berlin)
    - cron: "7 17 * * 4"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen zum Testen

permissions:
  contents: write   # damit die ID der Übersicht gespeichert wird (zum Löschen nach dem Wochenende)

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # neuesten Stand holen, nicht den vom Anlegen des Laufs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rennen des Wochenendes posten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Rolle auch bei der Wochenübersicht pingen? Dann das # vor der nächsten Zeile entfernen.
          # DISCORD_ROLLEN_ID: ${{ vars.DISCORD_ROLLEN_ID }}
          F1_TRAININGS: "ja"                # "nein" = freie Trainings in der Übersicht ausblenden
          LEERES_WOCHENENDE_POSTEN: "ja"    # "nein" = bei rennfreien Wochenenden nichts posten
          WEC_AUTOMATISCH: "ja"             # WEC-Zeitplan automatisch von fiawec.com laden
          LOESCHEN_NACH_MINUTEN: "60"       # Übersicht so lange nach der letzten Session löschen
        run: python bot.py
      # Gelöscht wird die Übersicht vom Workflow "Session-Erinnerungen", sobald es so weit ist.
      - name: ID der Übersicht merken
        run: |
          if [ -n "$(git status --porcelain uebersicht.json)" ]; then
            git config user.name "rennwochenende-bot"
            git config user.email "rennwochenende-bot@users.noreply.github.com"
            git add uebersicht.json
            git commit -m "Wochenübersicht gemerkt"
            git pull --rebase --quiet || true
            git push
          fi
